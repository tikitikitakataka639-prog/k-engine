services:
  kengine:
    image: node:22
    working_dir: /app
    restart: on-failure
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:8080"
    environment:
      - CHOKIDAR_USEPOLLING=1
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"Promise.all(['http://127.0.0.1:8080/','http://127.0.0.1:8080/health'].map(u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u)}))).catch(e=>{console.error('FAIL',e.message);process.exit(1)})\""]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 120s
  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /app
    network_mode: "service:kengine" # mismo localhost que la app: contexto seguro (Cache API/WebGPU)
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - E2E_BASE_URL=http://localhost:8080
      - E2E_REAL_MODEL=${E2E_REAL_MODEL:-0}
    depends_on:
      kengine:
        condition: service_healthy
    command: ["npx", "playwright", "test"]
volumes:
  node_modules:
